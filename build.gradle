plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    maven { url = "https://maven.terraformersmc.com/releases/" }
    maven { url = "https://maven.shedaniel.me/" }
}

fabricApi {
    // Creates the "gametest" source set and the runClientGameTest task used by the in-game smoke tests
    configureTests {
        createSourceSet = true
        modId = "wynn-wanderer-gametest"
        enableGameTests = false
        enableClientGameTests = true
        eula = true
    }
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // YAH YAH MOD MENU
    // Mod Menu and Cloth Config are optional, they only add the config screen. Without them the settings are
    // read from config/wynn-wanderer.toml. Run with -PwithoutConfigScreen to test the mod without them.
    modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
    modCompileOnly("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    if (!project.hasProperty("withoutConfigScreen")) {
        modLocalRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"
        modLocalRuntime("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
            exclude(group: "net.fabricmc.fabric-api")
        }
    }
    // The unit tests read the config annotations
    testImplementation("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    // VERY IMPORTANT WYNNTILS!!!
    // Modrinth has one version per loader sharing the same version number, so we pin the Fabric build by its version id
    modImplementation "maven.modrinth:wynntils:${project.wynntils_modrinth_id}"

    // Fabric API. This is technically optional, but you probably want it anyway.
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    testImplementation platform("org.junit:junit-bom:${project.junit_version}")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    inputs.property "wynntils_version", project.wynntils_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version,
                "wynntils_version": project.wynntils_version
    }
}

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"
    it.options.release.set(targetJavaVersion)
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}

tasks.withType(Test).configureEach {
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat = "full"
    }
}

test {
    useJUnitPlatform {
        excludeTags "wynncraft-pack"
    }
}

// Checks the mod against the newest Wynncraft resource pack a launcher on this machine downloaded (its SHA-1 is
// verified against the one the server sent). Skipped when there is none, like in CI. See WynncraftPack for the
// -PwynncraftPack, -PwynncraftPackSha1, -PwynncraftPackDirs and -PrequireWynncraftPack options.
def testWynncraftPack = tasks.register("testWynncraftPack", Test) {
    description = "Checks the mod against the latest Wynncraft resource pack."
    group = "verification"
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags "wynncraft-pack"
    }
    // Shows which pack was tested
    testLogging.showStandardStreams = true
    // The pack is found outside of the project, so Gradle cannot tell when a new one was downloaded
    outputs.upToDateWhen { false }

    ["wynncraftPack", "wynncraftPackSha1", "wynncraftPackDirs"].each { name ->
        if (project.hasProperty(name)) {
            systemProperty "wynnWanderer.${name}", project.property(name).toString()
        }
    }
    if (project.hasProperty("requireWynncraftPack")) {
        def value = project.property("requireWynncraftPack").toString()
        systemProperty "wynnWanderer.requireWynncraftPack", value.isEmpty() ? "true" : value
    }
}

tasks.named("check") {
    dependsOn testWynncraftPack
}

jar {
    from("LICENSE.txt") {
        rename { "${it}_${base.archivesName.get()}" }
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}
